# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: USERNAME/REPO-NAME          # ← استبدل
  branch: main
  base_url: https://WORKER.workers.dev   # ← استبدل

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

i18n:
  structure: multiple_folders
  locales: [ar, en, fr]
  default_locale: ar

collections:
  - name: "posts"
    label: "المقالات"
    label_singular: "مقال"
    folder: "content/posts"
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string", i18n: true }
      - { label: "الفئة", name: "category", widget: "select", options: ["tech", "cars", "life"], i18n: duplicate }
      - { label: "التاريخ", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "الكاتب", name: "author", widget: "string", i18n: true }
      - { label: "الصورة", name: "image", widget: "image", required: false, i18n: duplicate }
      - { label: "المقتطف", name: "excerpt", widget: "text", i18n: true }
      - { label: "المحتوى", name: "body", widget: "richtext", i18n: true }