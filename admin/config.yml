backend:
  name: github
  repo: lidenoniso3-ctrl/blog
  branch: main
  base_url: https://sveltia-cms-auth.lidenoniso3.workers.dev

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "posts_ar"
    label: "المقالات - عربية 🇸🇦"
    folder: "content/posts/ar"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "Slug (بالإنجليزية)", name: "slug", widget: "string" }
      - { label: "الفئة", name: "category", widget: "select", options: ["tech", "cars", "life"] }
      - { label: "التاريخ", name: "date", widget: "datetime" }
      - { label: "الكاتب", name: "author", widget: "string" }
      - { label: "الصورة", name: "image", widget: "image", required: false }
      - { label: "المقتطف", name: "excerpt", widget: "text" }
      - { label: "المحتوى", name: "body", widget: "richtext" }

  - name: "posts_en"
    label: "Articles - English 🇬🇧"
    folder: "content/posts/en"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["tech", "cars", "life"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "richtext" }

  - name: "posts_fr"
    label: "Articles - Français 🇫🇷"
    folder: "content/posts/fr"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["tech", "cars", "life"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Auteur", name: "author", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Extrait", name: "excerpt", widget: "text" }
      - { label: "Contenu", name: "body", widget: "richtext" }