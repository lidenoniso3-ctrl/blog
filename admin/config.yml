# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: lidenoniso3-ctrl/blog
  branch: main
  base_url: https://sveltia-cms-auth.lidenoniso3.workers.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "المقالات"
    label_singular: "مقال"
    folder: "content/posts/{{fields.lang}}"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    fields:
      - {
          label: "اللغة",
          name: "lang",
          widget: "select",
          options: [
            { label: "🇸🇦 العربية", value: "ar" },
            { label: "🇬🇧 English", value: "en" },
            { label: "🇫🇷 Français", value: "fr" }
          ],
          default: "ar",
          hint: "اختر لغة المقال — كل مقال في لغة واحدة فقط"
        }
      
      - {
          label: "العنوان",
          name: "title",
          widget: "string",
          hint: "اكتب العنوان بلغة المقال"
        }
      
      - {
          label: "الرابط بالإنجليزية (Slug)",
          name: "slug",
          widget: "string",
          hint: "بالإنجليزية فقط — مثال: tesla-vs-rivals-2026"
        }
      
      - {
          label: "الفئة",
          name: "category",
          widget: "select",
          options: ["tech", "cars", "life"]
        }
      
      - {
          label: "التاريخ",
          name: "date",
          widget: "datetime"
        }
      
      - {
          label: "الكاتب",
          name: "author",
          widget: "string"
        }
      
      - {
          label: "الصورة",
          name: "image",
          widget: "image",
          required: false
        }
      
      - {
          label: "المقتطف",
          name: "excerpt",
          widget: "text"
        }
      
      - {
          label: "المحتوى",
          name: "body",
          widget: "richtext"
        }