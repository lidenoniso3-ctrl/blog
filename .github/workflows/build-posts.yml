name: Build posts.json

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml markdown

      - name: Build posts.json
        run: python scripts/build-posts.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 تحديث posts.json"
          git push
